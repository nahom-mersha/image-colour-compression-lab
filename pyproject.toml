[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "reusable-ai-template"
version = "0.1.0"
description = "A reusable Python project template for AI engineering projects"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]